<!DOCTYPE html>
<html lang="en">
<head>
<script src="config.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Launchpad Wars</title>
<meta name="description" content="Round one, and he never needed a round two" />
<link rel="icon" type="image/png" href="assets/favicon.png" />
<link rel="apple-touch-icon" href="assets/apple-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
:root{
  --void:#0a0714; --deep:#150e28; --paper:#f3eefe; --hot:#ff2d6f; --cyan:#2de2ff; --lime:#8bff4a; --gold:#ffcc33;
  --px:"Press Start 2P",monospace; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --pad:clamp(12px,2.2vw,28px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--void);color:var(--paper);font-family:var(--mono);font-size:13px;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

.wrap{position:fixed;inset:0;overflow:hidden}
.scr{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .32s}
.scr.on{opacity:1;pointer-events:auto}
.crt{position:fixed;inset:0;z-index:40;pointer-events:none;background:repeating-linear-gradient(rgba(0,0,0,.22) 0 1px,transparent 1px 3px);opacity:.45;mix-blend-mode:multiply}
.glow{position:fixed;inset:0;z-index:39;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 45%,rgba(10,7,20,.75))}

/* ---------- top hud ---------- */
.hud{position:fixed;z-index:45;display:flex;gap:7px;align-items:center}
.tl{left:var(--pad);top:var(--pad)}
.tr{right:var(--pad);top:var(--pad)}
.key{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 13px;font-family:var(--px);font-size:8px;letter-spacing:.04em;text-transform:uppercase;color:var(--paper);background:rgba(21,14,40,.82);border:2px solid rgba(243,238,254,.28);transition:border-color .18s,background .18s}
.key:hover{border-color:var(--cyan);background:rgba(45,226,255,.14)}
.key svg{width:13px;height:13px}
.key img{width:22px;height:22px;border:2px solid rgba(243,238,254,.28)}
.key.buy{background:var(--hot);border-color:var(--hot);color:#fff}
.key.buy:hover{background:#e02360;border-color:#e02360}

/* ---------- select ---------- */
#sel{display:grid;place-content:center;overflow-y:auto;gap:clamp(14px,2.4vw,26px);justify-items:center;padding:calc(var(--pad) + 46px) var(--pad) var(--pad);
  background:radial-gradient(90% 70% at 50% 40%,#241546,#0a0714 72%)}
.kick{font-family:var(--px);font-size:clamp(9px,1.5vw,15px);letter-spacing:.06em;color:var(--gold);text-shadow:0 3px 0 #7a5a00}
.grid{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(6px,1vw,12px);width:min(760px,90vw)}
.cell{position:relative;aspect-ratio:1;overflow:hidden;border:2px solid rgba(243,238,254,.2);background:#1a1030;filter:saturate(.55) brightness(.62);transition:filter .18s}
.cell img{width:100%;height:100%;object-fit:cover}
.cell b{position:absolute;left:0;right:0;bottom:0;padding:5px 4px;font-family:var(--px);font-size:clamp(5.5px,.85vw,8px);text-align:center;background:rgba(10,7,20,.82);color:var(--paper)}
.cell.hi{filter:none}
.cell.taken{filter:none;border-color:var(--lime)}
.cur{position:absolute;border:4px solid var(--cyan);box-shadow:0 0 0 2px rgba(10,7,20,.8),0 0 22px rgba(45,226,255,.65);pointer-events:none;transition:transform .13s cubic-bezier(.2,1.5,.4,1),width .13s,height .13s;z-index:3}
.cur.lock{border-color:var(--lime);box-shadow:0 0 0 2px rgba(10,7,20,.8),0 0 30px rgba(139,255,74,.8);animation:lockflash .12s steps(2) 6}
@keyframes lockflash{0%{opacity:1}50%{opacity:.25}100%{opacity:1}}
.pick{font-family:var(--px);font-size:clamp(8px,1.2vw,12px);color:var(--lime);opacity:0;transition:opacity .2s}
.pick.on{opacity:1}

/* ---------- vs ---------- */
#vs{display:grid;grid-template-columns:1fr 1fr;background:#0a0714}
.vhalf{position:relative;overflow:hidden;display:grid;place-items:center}
.vhalf img{width:100%;height:100%;object-fit:cover}
.vhalf.l{transform:translateX(-102%);transition:transform .5s cubic-bezier(.16,1,.3,1)}
.vhalf.r{transform:translateX(102%);transition:transform .5s cubic-bezier(.16,1,.3,1)}
#vs.on .vhalf{transform:none}
.vhalf .nm{position:absolute;bottom:9%;left:0;right:0;text-align:center;font-family:var(--px);font-size:clamp(9px,1.7vw,17px);color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.55)}
.vsx{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(2.4);z-index:5;font-family:var(--px);font-size:clamp(30px,7vw,74px);color:var(--gold);text-shadow:0 7px 0 #7a1330,0 0 40px rgba(255,204,51,.6);opacity:0;transition:transform .34s cubic-bezier(.2,1.6,.4,1),opacity .2s}
#vs.on .vsx{transform:translate(-50%,-50%) scale(1);opacity:1;transition-delay:.42s}

/* ---------- fight ---------- */
#fig{overflow:hidden}
#fig .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tint{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,7,20,.45),transparent 34%,rgba(10,7,20,.3))}
.fighter{position:absolute;bottom:9%;height:clamp(180px,42vh,360px);width:auto;max-width:none;filter:drop-shadow(0 18px 12px rgba(0,0,0,.5));transition:transform .16s}
.fighter.a{left:16%}
.fighter.b{right:14%}
.fighter.hidden{display:none}
#fig.lunge .fighter.a{transform:translateX(46px)}
#fig.lunge .fighter.b{transform:translateX(30px) rotate(3deg)}
#fig.shake{animation:shk .2s steps(3)}
@keyframes shk{0%{transform:translate(0,0)}33%{transform:translate(-9px,4px)}66%{transform:translate(7px,-5px)}100%{transform:translate(0,0)}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .1s}
.flash.on{opacity:.6;transition:none}
.dmg{position:absolute;font-family:var(--px);font-size:clamp(11px,1.9vw,20px);color:var(--gold);text-shadow:0 4px 0 #7a1330;pointer-events:none;animation:dfly .8s ease-out forwards}
@keyframes dfly{0%{opacity:0;transform:translate(-50%,0) scale(.6)}18%{opacity:1;transform:translate(-50%,-14px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-72px) scale(1)}}

/* bars */
.bars{position:absolute;left:0;right:0;top:calc(var(--pad) + 44px);z-index:20;display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(8px,1.6vw,20px);align-items:start;padding:0 var(--pad)}
.bar{position:relative}
.bar .nm{font-family:var(--px);font-size:clamp(6.5px,1vw,10px);margin-bottom:5px;color:var(--paper)}
.bar.rt .nm{text-align:right}
.bar .track{height:clamp(13px,1.9vw,20px);border:2px solid rgba(243,238,254,.5);background:#2a0d18;position:relative;overflow:hidden}
.bar .fill{position:absolute;inset:0;background:linear-gradient(180deg,#b7ff5a,#4fbf12);transition:width .28s cubic-bezier(.2,1,.3,1)}
.bar.rt .fill{right:0;left:auto}
.bar .fill.low{background:linear-gradient(180deg,#ffd25a,#ff5a2d)}
.clock{align-self:center;font-family:var(--px);font-size:clamp(14px,2.4vw,26px);color:var(--gold);text-shadow:0 4px 0 #7a5a00;padding-top:14px;font-variant-numeric:tabular-nums}
.combo{position:absolute;left:var(--pad);top:calc(var(--pad) + 108px);z-index:20;font-family:var(--px);font-size:clamp(9px,1.5vw,15px);color:var(--cyan);text-shadow:0 4px 0 #063d4a;opacity:0;transform:scale(.7);transition:opacity .16s,transform .16s}
.combo.on{opacity:1;transform:scale(1)}
.round{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(1.6);z-index:25;font-family:var(--px);font-size:clamp(18px,4.4vw,48px);color:#fff;text-shadow:0 6px 0 var(--hot),0 0 40px rgba(255,45,111,.6);opacity:0;transition:opacity .2s,transform .35s cubic-bezier(.2,1.6,.4,1);pointer-events:none;white-space:nowrap}
.round.on{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* ---------- result ---------- */
#res{display:grid;place-content:center;overflow-y:auto;justify-items:center;gap:clamp(12px,2vw,22px);text-align:center;padding:calc(var(--pad) + 52px) var(--pad) var(--pad);
  background:radial-gradient(85% 70% at 50% 42%,#2a1350,#0a0714 74%)}
#res .win{font-family:var(--px);font-size:clamp(13px,2.8vw,32px);color:var(--gold);text-shadow:0 6px 0 #7a1330;line-height:1.5}
#res .sub{font-size:clamp(11px,1.4vw,14px);color:#b6acd6;max-width:44ch}
.plate{width:min(560px,92vw);background:rgba(21,14,40,.86);border:2px solid rgba(243,238,254,.24);padding:16px;display:grid;gap:12px;justify-items:center}
.plate .l{font-family:var(--px);font-size:8px;color:var(--cyan);letter-spacing:.06em}
.ca{display:grid;justify-items:center;gap:9px;width:100%;cursor:pointer}
.ca b{font-family:var(--px);font-size:clamp(14px,2.6vw,24px);color:var(--paper);text-shadow:0 4px 0 rgba(0,0,0,.5)}
.ca.live b{font-family:var(--mono);font-weight:600;font-size:clamp(10px,2.6vw,14px);color:var(--lime);text-shadow:none;word-break:break-all}
.ca .cp{font-family:var(--px);font-size:7.5px;padding:7px 12px;border:2px dashed rgba(243,238,254,.35);color:var(--paper)}
.ca.live .cp{border-style:solid;border-color:var(--lime);color:var(--lime)}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.again{font-family:var(--px);font-size:8px;color:#7c6fa8}

@media (max-width:820px){
  .tr .key.buy span{display:none}
  .tl span{display:none}
  .tl .key{padding:0 9px}
  .grid{width:min(420px,94vw);gap:5px}
  .fighter{height:clamp(140px,26vh,220px);bottom:8%}
  .fighter.a{left:6%}
  .fighter.b{right:4%}
  #fig.lunge .fighter.a{transform:translateX(26px)}
  .bars{grid-template-columns:1fr auto 1fr;gap:8px}
  .combo{top:calc(var(--pad) + 96px)}
  #vs{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
  .vhalf.l{transform:translateY(-102%)}
  .vhalf.r{transform:translateY(102%)}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition-duration:.01ms !important}}
</style>
</head>
<body>

<div class="wrap">

  <!-- character select -->
  <section class="scr" id="sel">
    <div class="kick">Choose your fighter</div>
    <div class="grid" id="grid">
      <div class="cell"><img src="assets/c2.webp" alt="" /><b>The Dev</b></div>
      <div class="cell"><img src="assets/c3.webp" alt="" /><b>The Sniper</b></div>
      <div class="cell"><img src="assets/c5.webp" alt="" /><b>The Whale</b></div>
      <div class="cell"><img src="assets/c6.webp" alt="" /><b>The Jeet</b></div>
      <div class="cell" data-hero><img src="assets/c1.webp" alt="" /><b>Pons Cat</b></div>
      <div class="cell"><img src="assets/c4.webp" alt="" /><b>The Rug</b></div>
      <div class="cur" id="cur"></div>
    </div>
    <div class="pick" id="pick">Pons Cat selected</div>
  </section>

  <!-- versus -->
  <section class="scr" id="vs">
    <div class="vhalf l"><img src="assets/c1.webp" alt="" /><div class="nm">Pons Cat</div></div>
    <div class="vhalf r"><img src="assets/c4.webp" alt="" /><div class="nm">The Rug</div></div>
    <div class="vsx">VS</div>
  </section>

  <!-- fight -->
  <section class="scr" id="fig">
    <img class="bg" src="assets/stage.webp" alt="" />
    <div class="tint"></div>
    <img class="fighter a" id="fa" src="assets/k1.webp" alt="" />
    <img class="fighter a hidden" id="fa2" src="assets/k2.webp" alt="" />
    <img class="fighter b" id="fb" src="assets/r1.webp" alt="" />
    <img class="fighter b hidden" id="fb2" src="assets/r2.webp" alt="" />
    <div class="flash" id="flash"></div>
    <div class="bars">
      <div class="bar"><div class="nm">Pons Cat</div><div class="track"><div class="fill" id="hpA" style="width:100%"></div></div></div>
      <div class="clock" id="timer">60</div>
      <div class="bar rt"><div class="nm">The Rug</div><div class="track"><div class="fill" id="hpB" style="width:100%"></div></div></div>
    </div>
    <div class="combo" id="combo">0 hits</div>
    <div class="round" id="round">Round 1</div>
  </section>

  <!-- result -->
  <section class="scr" id="res">
    <div class="win">Pons Cat wins<br />Perfect</div>
    <p class="sub">He took it from the rug and gave it back to the room</p>
    <div class="plate">
      <div class="l">Contract</div>
      <div class="ca" id="ca"><b id="caVal">soon</b><button class="cp" id="caCopy">[ Copy ]</button></div>
      <div class="btns">
        <a class="key buy" data-link="pons" href="https://www.ponsfamily.com/launchpad">Buy on Pons<svg><use href="#i-pons"/></svg></a>
        <a class="key" data-link="x" href="https://x.com" aria-label="X"><svg><use href="#i-x"/></svg></a>
        <a class="key" href="/docs">Docs</a>
      </div>
    </div>
    <div class="again" id="again">Next fight in 8</div>
  </section>

</div>

<a class="hud tl key" href="/"><img src="assets/avatar.webp" alt="" /><span data-name>Launchpad Wars</span></a>
<nav class="hud tr">
  <a class="key buy" data-link="pons" href="https://www.ponsfamily.com/launchpad"><span>Buy</span><svg><use href="#i-pons"/></svg></a>
  <a class="key" data-link="x" href="https://x.com" aria-label="X"><svg><use href="#i-x"/></svg></a>
  <a class="key" href="/docs">Docs</a>
</nav>

<div class="glow"></div><div class="crt"></div>

<audio id="bgm" src="assets/music.mp3" loop preload="none"></audio>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-pons" viewBox="0 0 64 64"><path d="M14 8h24c11 0 18 7 18 17s-7 17-18 17h-9v12a3 3 0 0 1-3 3H17a3 3 0 0 1-3-3V11a3 3 0 0 1 3-3z" fill="currentColor"/><path d="M29 20h8c4 0 6.5 2 6.5 5s-2.5 5-6.5 5h-8z" fill="#fff" opacity=".9"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path fill="currentColor" d="M18.9 2H22l-7.1 8.1L23 22h-6.6l-5.2-6.8L5.3 22H2.1l7.6-8.7L1.5 2h6.7l4.7 6.2L18.9 2zm-1.1 18h1.8L7.3 3.9H5.4L17.8 20z"/></symbol>
</svg>

<script>
(function(){
  var S = window.SITE, CA = (S.CA||"SOON").trim(), HAS_CA = CA !== "SOON" && CA !== "";
  document.querySelectorAll('[data-name]').forEach(function(e){ e.textContent = S.NAME; });
  document.title = S.NAME;
  document.querySelectorAll('[data-link="pons"]').forEach(function(a){ a.href = HAS_CA ? window.PONS_HOME + '/' + CA : window.PONS_HOME; a.target='_blank'; a.rel='noopener'; });
  document.querySelectorAll('[data-link="x"]').forEach(function(a){ a.href = S.X_URL || 'https://x.com'; a.target='_blank'; a.rel='noopener'; });
  var caBox = document.getElementById('ca'), caVal = document.getElementById('caVal'), caCopy = document.getElementById('caCopy');
  caVal.textContent = HAS_CA ? CA : 'soon';
  if(HAS_CA){ caBox.classList.add('live'); caBox.title = CA; }
  caBox.addEventListener('click', function(){ var old = caCopy.textContent; if(HAS_CA){ if(navigator.clipboard) navigator.clipboard.writeText(CA); caCopy.textContent = '[ Copied ]'; } else { caCopy.textContent = '[ Not yet ]'; } setTimeout(function(){ caCopy.textContent = old; }, 1400); });

  var bgm = document.getElementById('bgm'), armed = false, hasMusic = true;
  bgm.addEventListener('error', function(){ hasMusic = false; });
  function arm(){ if(armed) return; armed = true; if(hasMusic){ bgm.volume = .22; bgm.play().catch(function(){}); } }
  document.addEventListener('pointerdown', arm, true); document.addEventListener('keydown', arm, true);

  var Q = [], reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function at(ms, fn){ Q.push(setTimeout(fn, ms)); }
  function clear(){ Q.forEach(clearTimeout); Q = []; }
  function show(id){ document.querySelectorAll('.scr').forEach(function(s){ s.classList.toggle('on', s.id === id); }); }

  var sel = document.getElementById('sel'), grid = document.getElementById('grid'), cur = document.getElementById('cur');
  var cells = [].slice.call(grid.querySelectorAll('.cell'));
  var hero = cells.findIndex(function(c){ return c.hasAttribute('data-hero'); });
  var pick = document.getElementById('pick');
  function place(i){
    var c = cells[i], g = grid.getBoundingClientRect(), r = c.getBoundingClientRect();
    cur.style.width = r.width + 'px'; cur.style.height = r.height + 'px';
    cur.style.transform = 'translate(' + (r.left - g.left) + 'px,' + (r.top - g.top) + 'px)';
    cells.forEach(function(x, j){ x.classList.toggle('hi', j === i); });
  }

  var fig = document.getElementById('fig'), fa = document.getElementById('fa'), fa2 = document.getElementById('fa2');
  var fb = document.getElementById('fb'), fb2 = document.getElementById('fb2');
  var hpB = document.getElementById('hpB'), timer = document.getElementById('timer');
  var combo = document.getElementById('combo'), roundEl = document.getElementById('round'), flash = document.getElementById('flash');
  var again = document.getElementById('again');

  function dmg(n){
    var d = document.createElement('div');
    d.className = 'dmg'; d.textContent = '-' + n;
    d.style.left = (fig.clientWidth * (innerWidth < 820 ? .72 : .74)) + 'px';
    d.style.top = (fig.clientHeight * .42) + 'px';
    fig.appendChild(d);
    setTimeout(function(){ d.remove(); }, 900);
  }

  function hit(i, total, hp){
    fa.classList.add('hidden'); fa2.classList.remove('hidden');
    fig.classList.add('lunge');
    at(130, function(){
      fb.classList.add('hidden'); fb2.classList.remove('hidden');
      if(!reduce){ fig.classList.add('shake'); flash.classList.add('on'); }
      hpB.style.width = hp + '%';
      hpB.classList.toggle('low', hp < 42);
      combo.textContent = i + (i === 1 ? ' hit' : ' hits');
      combo.classList.add('on');
      dmg(Math.round(100 / total));
    });
    at(250, function(){ flash.classList.remove('on'); fig.classList.remove('shake'); });
    at(340, function(){
      fig.classList.remove('lunge');
      fa2.classList.add('hidden'); fa.classList.remove('hidden');
      fb2.classList.add('hidden'); fb.classList.remove('hidden');
    });
  }

  function run(){
    clear();
    /* reset */
    show('sel');
    cells.forEach(function(c){ c.classList.remove('taken'); });
    cur.classList.remove('lock'); pick.classList.remove('on');
    hpB.style.width = '100%'; hpB.classList.remove('low');
    combo.classList.remove('on'); combo.textContent = '0 hits';
    roundEl.classList.remove('on'); timer.textContent = '60';
    fa.classList.remove('hidden'); fa2.classList.add('hidden');
    fb.classList.remove('hidden'); fb2.classList.add('hidden');
    place(0);

    /* the cursor walks the roster and lands on the cat */
    var path = [0, 1, 2, 5, 4, 3, 4, hero];
    path.forEach(function(i, k){ at(420 + k * 300, function(){ place(i); }); });
    var lockAt = 420 + path.length * 300;
    at(lockAt, function(){ cur.classList.add('lock'); cells[hero].classList.add('taken'); pick.classList.add('on'); });

    /* versus */
    at(lockAt + 1000, function(){ show('vs'); });

    /* fight */
    var t0 = lockAt + 3400;
    at(t0, function(){ show('fig'); roundEl.textContent = 'Round 1'; roundEl.classList.add('on'); });
    at(t0 + 1100, function(){ roundEl.textContent = 'Fight'; });
    at(t0 + 1900, function(){ roundEl.classList.remove('on'); });

    var HITS = 7, first = t0 + 2200, gap = 900, hp = 100;
    for(var i = 1; i <= HITS; i++){
      (function(i){
        hp = Math.max(0, Math.round(100 - (100 / HITS) * i));
        var h = hp;
        at(first + (i - 1) * gap, function(){ hit(i, HITS, h); });
      })(i);
    }
    /* the clock keeps running while he works */
    for(var s = 0; s < 12; s++){
      (function(s){ at(t0 + 1900 + s * 700, function(){ timer.textContent = String(60 - s - 1); }); })(s);
    }

    var koAt = first + HITS * gap;
    at(koAt, function(){ roundEl.textContent = 'K.O.'; roundEl.classList.add('on'); fb.classList.add('hidden'); fb2.classList.remove('hidden'); if(!reduce) fig.classList.add('shake'); });
    at(koAt + 400, function(){ fig.classList.remove('shake'); });
    at(koAt + 1800, function(){ show('res'); });

    /* the queue never empties */
    var wait = 9;
    for(var w = 0; w < wait; w++){
      (function(w){ at(koAt + 2000 + w * 1000, function(){ again.textContent = 'Next fight in ' + (wait - w - 1); }); })(w);
    }
    at(koAt + 2000 + wait * 1000, run);
  }

  addEventListener('resize', function(){ if(sel.classList.contains('on')) place(cells.findIndex(function(c){ return c.classList.contains('hi'); }) || 0); });
  if(document.readyState === 'complete') run(); else addEventListener('load', run);
})();
</script>
</body>
</html>
